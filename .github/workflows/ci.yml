name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/scan-secrets.sh

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/RenuxServer/wwwroot/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/RenuxServer/wwwroot/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/RenuxServer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - run: dotnet restore RenuxServer.sln
      - run: dotnet build RenuxServer.sln --configuration Release --no-restore
      # 계약 테스트 프로젝트는 RenuxServer.sln에 포함되지 않으므로 --no-build/--no-restore를
      # 쓸 수 없다. dotnet run이 테스트 프로젝트만 restore·build하고, 참조하는
      # RenuxServer는 위 Release 빌드 결과를 증분 재사용한다. 실패 시 non-zero로 종료한다.
      - name: Run backend contract tests
        run: dotnet run --project Tests/RenuxServer.ContractTests.csproj --configuration Release

  rag-python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/RAG
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            src/RAG/requirements.txt
            src/RAG/requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q -p no:randomly
      # 개발자 로컬에는 데이터가 채워진 rag_database.db가 있어서, 테이블이 없는
      # 상태에서만 드러나는 실패가 푸시 전까지 보이지 않는다. 실제로 스케줄러 실행
      # 기록을 추가했을 때 로컬 596건이 모두 통과하고 CI에서만 깨졌다.
      # 같은 검사를 로컬에서도 재현할 수 있게 RAG_DATABASE_FILE로 경로를 바꾼다:
      #   RAG_DATABASE_FILE=/tmp/empty.db python -m pytest -q
      - name: Run tests against an empty database
        env:
          RAG_DATABASE_FILE: ${{ runner.temp }}/empty-rag.db
        run: python -m pytest -q -p no:randomly
      # 테스트 격리 회귀(예: 실제 Chroma 쓰기)를 잡기 위해 순서를 무작위로 섞어 한 번 더 돈다.
      # 시드는 pytest 헤더(Using --randomly-seed=...)에 찍힌다(-q는 헤더를 숨기므로 쓰지 않는다).
      # 실패하면 로컬에서 같은 순서를 재현한다:
      #   RAG_DATABASE_FILE=/tmp/empty-random.db python -m pytest -p randomly --randomly-seed=<run_id>
      - name: Run tests in random order against an empty database
        env:
          RAG_DATABASE_FILE: ${{ runner.temp }}/empty-rag-random.db
        run: python -m pytest -p randomly --randomly-seed=${{ github.run_id }}
