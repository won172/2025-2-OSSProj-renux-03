name: RAG Golden Candidate Run

on:
  pull_request:
    paths:
      - "src/RAG/**"
      - ".github/workflows/rag-golden-release.yml"
  workflow_dispatch:
    inputs:
      concurrency:
        description: Concurrent candidate requests
        required: true
        default: "1"

jobs:
  real-candidate-gate:
    runs-on: ubuntu-latest
    environment: rag-golden-release
    defaults:
      run:
        working-directory: src/RAG
    env:
      RAG_GOLDEN_BASE_URL: ${{ secrets.RAG_GOLDEN_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      # 이 게이트는 배포된 후보 엔드포인트에 실제 HTTP를 쏜다. 엔드포인트가 없으면
      # 검증할 대상 자체가 없으므로, 실패시키지 않고 건너뛴 사실을 눈에 띄게 남긴다.
      # (예전에는 여기서 바로 실패해 src/RAG를 건드리는 모든 PR이 영구히 빨간불이었다.)
      - name: Detect candidate endpoint
        id: candidate
        run: |
          if [ -n "$RAG_GOLDEN_BASE_URL" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=골든 게이트 건너뜀::RAG_GOLDEN_BASE_URL이 설정되지 않아 실제 후보 검증을 건너뜁니다. 이 PR은 골든 매트릭스로 검증되지 않았습니다."
            {
              echo "### RAG 골든 후보 검증: **건너뜀**"
              echo
              echo "\`RAG_GOLDEN_BASE_URL\` 시크릿이 없어 실행하지 않았습니다."
              echo "이 PR은 골든 매트릭스로 검증되지 않았습니다 —"
              echo "배포 후보를 띄우고 시크릿을 설정한 뒤 이 워크플로를 수동 실행하세요."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/setup-python@v5
        if: steps.candidate.outputs.configured == 'true'
        with:
          python-version: "3.11"
      - name: Install evaluation dependencies
        if: steps.candidate.outputs.configured == 'true'
        run: python -m pip install 'jsonschema>=4.22.0'
      - name: Run all real HTTP cases
        if: steps.candidate.outputs.configured == 'true'
        run: >-
          python scripts/run_golden_matrix.py
          --base-url "$RAG_GOLDEN_BASE_URL"
          --output-dir "$RUNNER_TEMP/golden"
          --concurrency "${{ inputs.concurrency || '1' }}"
      - name: Verify replay provenance
        if: steps.candidate.outputs.configured == 'true'
        run: python scripts/verify_golden_replay.py --replay-dir "$RUNNER_TEMP/golden"
      - name: Evaluate four release axes
        if: steps.candidate.outputs.configured == 'true'
        run: >-
          python scripts/evaluate_golden_matrix.py
          --results "$RUNNER_TEMP/golden/results.jsonl"
          --manifest "$RUNNER_TEMP/golden/manifest.json"
          --output-dir "$RUNNER_TEMP/golden/report"
          --min-faithfulness 0.75
          --min-answer-relevancy 0.80
          --min-context-precision 0.70
          --min-context-recall 0.80
      - uses: actions/upload-artifact@v4
        if: always() && steps.candidate.outputs.configured == 'true'
        with:
          name: rag-golden-${{ github.sha }}
          path: ${{ runner.temp }}/golden
          if-no-files-found: error
