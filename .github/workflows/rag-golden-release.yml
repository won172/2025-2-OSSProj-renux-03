name: RAG Golden Candidate Run

on:
  pull_request:
    paths:
      - "src/RAG/**"
      - ".github/workflows/rag-golden-release.yml"
  workflow_dispatch:
    inputs:
      concurrency:
        description: Concurrent candidate requests
        required: true
        default: "1"

jobs:
  real-candidate-gate:
    runs-on: ubuntu-latest
    environment: rag-golden-release
    defaults:
      run:
        working-directory: src/RAG
    env:
      RAG_GOLDEN_BASE_URL: ${{ secrets.RAG_GOLDEN_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      # 이 게이트는 배포된 후보 엔드포인트에 실제 HTTP를 쏜다.
      # - pull_request: 엔드포인트가 없으면 건너뛰되(non-blocking) "NOT release evidence"를 남긴다.
      #   (예전처럼 여기서 실패시키면 src/RAG를 건드리는 모든 PR이 영구히 빨간불이 된다.)
      # - workflow_dispatch 등 그 밖의 이벤트(출시 실행): 엔드포인트가 없으면 실패한다.
      # 판단 로직은 scripts/check_golden_release_gate.py에 있고 pytest로 검증한다.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Detect candidate endpoint
        id: candidate
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: python scripts/check_golden_release_gate.py endpoint --event-name "$EVENT_NAME"
      - name: Install evaluation dependencies
        if: steps.candidate.outputs.configured == 'true'
        run: python -m pip install 'jsonschema>=4.22.0'
      - name: Run all real HTTP cases
        if: steps.candidate.outputs.configured == 'true'
        run: >-
          python scripts/run_golden_matrix.py
          --base-url "$RAG_GOLDEN_BASE_URL"
          --output-dir "$RUNNER_TEMP/golden"
          --concurrency "${{ inputs.concurrency || '1' }}"
      - name: Verify replay provenance
        if: steps.candidate.outputs.configured == 'true'
        run: python scripts/verify_golden_replay.py --replay-dir "$RUNNER_TEMP/golden"
      - name: Evaluate four release axes
        if: steps.candidate.outputs.configured == 'true'
        run: >-
          python scripts/evaluate_golden_matrix.py
          --results "$RUNNER_TEMP/golden/results.jsonl"
          --manifest "$RUNNER_TEMP/golden/manifest.json"
          --output-dir "$RUNNER_TEMP/golden/report"
          --release
          --min-faithfulness 0.75
          --min-answer-relevancy 0.80
          --min-context-precision 0.70
          --min-context-recall 0.80
      - name: Record PR run result
        if: steps.candidate.outputs.configured == 'true' && github.event_name == 'pull_request'
        run: |
          {
            echo "### RAG 골든 후보 검증: **통과 (PR 실행) — NOT release evidence**"
            echo
            echo "PR 실행 결과는 출시 근거가 아닙니다. 출시 판단은 workflow_dispatch 실행으로 하세요."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Record release evidence
        if: steps.candidate.outputs.configured == 'true' && github.event_name != 'pull_request'
        run: |
          {
            echo "### RAG 골든 후보 검증: **통과 — release evidence**"
            echo
            echo "전체 매트릭스 실제 HTTP 실행, provenance 검증, 네 축 평가를 모두 통과했습니다."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always() && steps.candidate.outputs.configured == 'true'
        with:
          name: rag-golden-${{ github.sha }}
          path: ${{ runner.temp }}/golden
          if-no-files-found: error
